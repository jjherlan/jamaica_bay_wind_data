on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

name: Deploy Shinylive App to GitHub Pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: shinylive-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libarchive-dev \
            libssl-dev \
            libuv1-dev \
            pkg-config

      - name: Install R packages
        shell: Rscript {0}
        run: |
          # Uses the prebuilt Linux binaries that setup-r configures (fast);
          # do not set repos= here or everything compiles from source.
          install.packages(c("shinylive", "shiny", "ggplot2", "dplyr",
                             "lubridate", "tidyr", "mgcv"))

      - name: Export Shinylive app
        shell: Rscript {0}
        run: |
          dir.create("app_bundle")
          file.copy(c("app.R", "DESCRIPTION", "jamaica_bay_clean.csv"), "app_bundle")
          shinylive::export("app_bundle", "_site")

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
